<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>YOUR NAME — Data Analyst Portfolio</title>
<meta name="description" content="Portfolio template — replace this description with your own." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<a class="skip-link" href="#hero">Skip to content</a>

<!-- ============================ NAVIGATION ============================ -->
<header class="nav" id="nav">
  <div class="shell nav__inner">
    <a class="nav__brand" href="#hero" data-brand>John Rhenwel Jerez</a>

    <nav class="nav__links" id="navLinks" aria-label="Main">
      <a href="#hero">Home</a>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#certificates">Certificates</a>
      <a href="#contact">Contact</a>
    </nav>

    <div class="nav__actions">
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch theme">
        <span data-theme-icon>☀️</span>
      </button>
      <button class="icon-btn nav__burger" id="navToggle" type="button"
              aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">
        <span class="burger"><i></i><i></i><i></i></span>
      </button>
    </div>
  </div>
</header>

<main>

  <!-- ============================== HERO ============================== -->
  <section class="hero" id="hero">
    <div class="shell hero__inner">
      <div class="hero__media">
        <div class="avatar" data-avatar></div>
        <span class="hero__role" data-role>IT Student | Aspiring Data & Technology Professional</span>
      </div>

      <div class="hero__text">
        <p class="hero__greeting" data-greeting>Hi, I'm</p>
        <h1 class="hero__name" data-fullname>John Rhenwel Jerez</h1>
        <p class="hero__tagline" data-tagline></p>

        <div class="hero__cta">
          <a class="btn btn--solid" data-cta-primary href="#projects">View my work</a>
          <a class="btn btn--ghost" data-cta-secondary href="#contact">Get in touch</a>
        </div>

        <ul class="social" data-social></ul>
      </div>
    </div>

    <div class="shell">
      <div class="tools" data-tools aria-label="Tools"></div>
    </div>
  </section>

  <!-- ============================== ABOUT ============================= -->
  <section class="section" id="about">
    <div class="shell">
      <header class="section__head">
        <p class="eyebrow"><span>// 01</span> <span data-about-eyebrow></span></p>
        <h2 class="section__title" data-about-heading></h2>
      </header>

      <div class="about">
        <div class="about__copy" data-about-copy></div>
        <aside class="about__panel">
          <p class="panel__label">What I work on</p>
          <ul class="checklist" data-about-capabilities></ul>
        </aside>
      </div>
    </div>
  </section>

  <!-- ============================== SKILLS ============================ -->
  <section class="section section--alt" id="skills">
    <div class="shell">
      <header class="section__head">
        <p class="eyebrow"><span>// 02</span> <span data-skills-eyebrow></span></p>
        <h2 class="section__title" data-skills-heading></h2>
      </header>
      <div class="grid grid--skills" data-skills></div>
    </div>
  </section>

  <!-- ============================= PROJECTS =========================== -->
  <section class="section" id="projects">
    <div class="shell">
      <header class="section__head">
        <p class="eyebrow"><span>// 03</span> <span data-projects-eyebrow></span></p>
        <h2 class="section__title" data-projects-heading></h2>
      </header>
      <div data-project-groups></div>
    </div>
  </section>

  <!-- =========================== CERTIFICATES ========================= -->
  <section class="section section--alt" id="certificates">
    <div class="shell">
      <header class="section__head">
        <p class="eyebrow"><span>// 04</span> <span data-certs-eyebrow></span></p>
        <h2 class="section__title" data-certs-heading></h2>
      </header>
      <div class="grid grid--certs" data-certificates></div>
    </div>
  </section>

  <!-- ============================= CONTACT ============================ -->
  <section class="section" id="contact">
    <div class="shell">
      <header class="section__head">
        <p class="eyebrow"><span>// 05</span> <span data-contact-eyebrow></span></p>
        <h2 class="section__title" data-contact-heading></h2>
        <p class="section__blurb" data-contact-blurb></p>
      </header>
      <div class="grid grid--contact" data-contact-channels></div>
    </div>
  </section>

</main>

<!-- ============================== FOOTER ============================== -->
<footer class="footer">
  <div class="shell footer__inner">
    <div>
      <p class="footer__name" data-footer-name></p>
      <p class="footer__role" data-footer-role></p>
    </div>
    <ul class="social" data-footer-social></ul>
    <p class="footer__copy" data-copyright></p>
  </div>
</footer>

<!-- ============================== LIGHTBOX ============================ -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
  <button class="lightbox__close" data-lb-close type="button" aria-label="Close preview">✕</button>
  <button class="lightbox__nav lightbox__nav--prev" data-lb-prev type="button" aria-label="Previous">‹</button>
  <figure class="lightbox__figure">
    <div class="lightbox__stage" data-lb-stage></div>
    <figcaption class="lightbox__caption" data-lb-caption></figcaption>
  </figure>
  <button class="lightbox__nav lightbox__nav--next" data-lb-next type="button" aria-label="Next">›</button>
</div>

<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
